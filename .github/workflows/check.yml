name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html is what src/ builds
        run: python3 dev/build.py --check

      - name: the three versions agree
        run: |
          python3 - <<'PY'
          import json, re
          page = open('index.html', encoding='utf-8').read()
          sw = open('sw.js', encoding='utf-8').read()
          upd = json.load(open('updates.json', encoding='utf-8'))
          v = re.search(r"const VERSION = '([0-9.]+)'", page).group(1)
          c = re.search(r'unote-v([0-9.]+)', sw).group(1)
          print('page', v, '| cache', c, '| updates.json', upd['version'])
          assert v == c == upd['version'], 'the three versions have to agree'
          PY

      # The page is allowed to *mention* addresses - the update file, the privacy policy, the
      # store listing for the other apps - because those are text and links somebody taps. What
      # it may never do is *load* something from another origin, or call out to a server of its
      # own. Grepping for "http" caught the first kind and failed every release, so this looks
      # at what is actually fetched.
      - name: the page stays self-contained
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys
          page = open('index.html', encoding='utf-8').read()
          bad = []

          # 1. Nothing the page renders or runs may come from somewhere else.
          loader = re.compile(r'<(script|link|img|source|video|audio|iframe|embed|object)\b[^>]*>', re.I)
          for m in loader.finditer(page):
              tag = m.group(0)
              if re.search(r'\b(src|srcset|href|data|poster)\s*=\s*["\']?(https?:)?//', tag, re.I):
                  bad.append(tag[:100])

          # 2. No CSS or import pulling a font, an image or a stylesheet off the page.
          for pattern, what in ((r'url\(\s*["\']?(https?:)?//', 'a url() from another origin'),
                                (r'@import\s+(?:url\()?["\']?(https?:)?//', 'an @import from another origin')):
              if re.search(pattern, page, re.I):
                  bad.append(what)

          # 3. The only requests are the app's own update check, and they only ever go to the
          #    page's own address (OTA_HOME) or to its own updates.json.
          for m in re.finditer(r'fetch\s*\([^;]{0,200}?\bhttps?://[^;]{0,200}?[\)\}]', page):
              call = m.group(0)
              if not re.search(r'OTA_HOME|updates\.json|anekthegreat\.github\.io/UNote/', call):
                  bad.append(call[:110].replace('\n', ' '))

          if bad:
              print('the page must not load or call out to another origin:')
              for item in bad[:10]:
                  print('  ' + item)
              sys.exit(1)
          print('no external requests: nothing is loaded from another origin')
          PY
