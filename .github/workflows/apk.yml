name: APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'updates.json'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'icon-maskable.svg'
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

env:
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: The upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/upload.jks
          {
            echo 'storeFile=../upload.jks'
            echo 'storeType=PKCS12'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties android/upload.jks
          echo 'release signing: on'

      # Every build must carry the SAME signing key. Android refuses to install an update signed
      # by a different key, so a throwaway debug key makes the download useless: the install is
      # rejected and the old app stays. When that happened here, the app looked like it could not
      # be updated at all. So a keyless build now fails loudly instead of being published.
      - name: Build
        run: |
          set -euo pipefail
          if [ ! -f android/keystore.properties ]; then
            echo 'No release keystore is configured (ANDROID_KEYSTORE_BASE64 is empty).'
            echo 'Refusing to publish a debug-signed APK: Android will not install it over the app already on the phone.'
            exit 1
          fi
          gradle -p android --no-daemon assembleRelease
          out=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$out"
          cp "$out" UNote.apk
          ls -l UNote.apk
          sha256sum UNote.apk > UNote.apk.sha256
          # The same build as a bundle, for Play: one artifact, two shapes, the same key.
          gradle -p android --no-daemon bundleRelease
          bundle=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$bundle"
          cp "$bundle" UNote.aab
          ls -l UNote.aab
          sha256sum UNote.aab > UNote.aab.sha256

      - name: Which key signed it, and what the bundle says about itself
        run: |
          set -euo pipefail
          apksigner=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --print-certs UNote.apk | head -4 || true
          fi
          jarsigner=$(command -v jarsigner || true)
          if [ -n "$jarsigner" ]; then
            jarsigner -verify -verbose:summary UNote.aab 2>&1 | tail -3 || true
          fi
          # The two numbers a store reads first: the version it is told and the SDK it targets.
          aapt2=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 2>/dev/null | sort | tail -1)
          if [ -n "$aapt2" ]; then
            "$aapt2" dump badging UNote.apk | grep -E "^(package|targetSdkVersion|sdkVersion)" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: UNote-apk
          path: |
            UNote.apk
            UNote.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: UNote-aab
          path: |
            UNote.aab
            UNote.aab.sha256

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: UNote APK
          body: |
            The installable build of UNote. The page is bundled inside the APK, so it
            works with no signal, and the notebook is that app's own - separate from
            the copy in a browser.

            UNote.aab is the same build as a bundle, for an app store listing.

            Version and what changed: see updates.json in the repository.
          files: |
            UNote.apk
            UNote.apk.sha256
            UNote.aab
            UNote.aab.sha256
          make_latest: true
