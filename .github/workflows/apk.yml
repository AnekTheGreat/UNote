name: APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'updates.json'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'icon-maskable.svg'
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

env:
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: The upload keystore, when the repository has one
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/upload.jks
          {
            echo 'storeFile=../upload.jks'
            echo 'storeType=jks'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties android/upload.jks
          echo 'release signing: on'

      - name: Build
        run: |
          set -euo pipefail
          if [ -f android/keystore.properties ]; then
            gradle -p android --no-daemon assembleRelease
            out=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          else
            echo 'release signing: off, so this is the debug build'
            gradle -p android --no-daemon assembleDebug
            out=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          test -n "$out"
          cp "$out" UNote.apk
          ls -l UNote.apk
          sha256sum UNote.apk > UNote.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: UNote-apk
          path: |
            UNote.apk
            UNote.apk.sha256

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: UNote APK
          body: |
            The installable build of UNote. The page is bundled inside the APK, so it
            works with no signal, and the notebook is that app's own - separate from
            the copy in a browser.

            Version and what changed: see updates.json in the repository.
          files: |
            UNote.apk
            UNote.apk.sha256
          make_latest: true
