import java.util.Properties

plugins {
    id 'com.android.application'
}

// Read from the page's own updates.json: a release number typed twice is a release number
// that drifts, and this one had (the build said 1.0.16 while the page said 1.0.18).
def appVersion = new groovy.json.JsonSlurper().parseText(rootProject.file('../updates.json').text).version

// android/keystore.properties exists only in CI, written from repository secrets.
def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    namespace 'app.unote'
    compileSdk 36

    defaultConfig {
        applicationId 'app.unote'
        // 24, not 23: Play's automatic protection refuses a bundle whose minimum is below 24,
        // which is the first thing it said about this one. Android 7.0 and later still covers
        // every phone this notebook was written for.
        minSdk 24
        // 36 is what a new listing on Play has to target from 31 August 2026.
        targetSdk 36
        // Three digits a part, so 1.0.19 is 1000019 and the code only ever goes up.
        versionCode appVersion.tokenize('.').collect { it.padLeft(3, '0') }.join('').toInteger()
        versionName appVersion
    }

    signingConfigs {
        release {
            if (ks.storeFile) {
                storeFile file(ks.storeFile)
                storeType ks.storeType ?: 'jks'
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks.storeFile) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Only for WebViewAssetLoader, which serves the bundled page from a real https
    // origin: IndexedDB and service workers are refused on file:// URLs.
    implementation 'androidx.webkit:webkit:1.11.0'
    // For the window insets on Android 15 and later, where the page would otherwise draw
    // under the status bar.
    implementation 'androidx.core:core:1.13.1'
}

// The page in the repository is the only copy: copy it into the APK at build time
// instead of keeping a second one that can drift.
def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('..')) {
        include 'index.html'
        include 'sw.js'
        include 'updates.json'
        include 'manifest.webmanifest'
        include 'icon.svg'
        include 'icon-maskable.svg'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}

preBuild.dependsOn syncWebAssets
