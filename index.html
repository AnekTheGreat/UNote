<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNote</title>
<meta name="description" content="UNote - your notes, your vault, on your phone.">
<meta name="theme-color" content="#0e1016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --accent:#8b6cff; --accent-soft:rgba(139,108,255,.18); --accent-ink:#fff;
    --bg:#0b0d14; --panel:rgba(26,31,45,.62); --panel2:rgba(255,255,255,.06); --panel3:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.055); --glass-line:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.20);
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
    --ink:#eef1f8; --dim:#a8b1c7; --dim2:#7d869b;
    --ok:#3ee0a6; --warn:#ffc857; --err:#ff8080;
    --r:18px; --r-sm:13px; --shadow:0 28px 64px rgba(0,0,0,.55);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --size:16px;
  }
  [data-theme="light"]{
    --bg:#eef1f9; --panel:rgba(255,255,255,.72); --panel2:rgba(255,255,255,.66); --panel3:rgba(255,255,255,.55);
    --glass:rgba(255,255,255,.62); --glass-line:rgba(18,24,42,.10); --glass-hi:rgba(255,255,255,.95);
    --line:rgba(18,24,42,.10); --line2:rgba(18,24,42,.17);
    --ink:#151922; --dim:#525b6e; --dim2:#7d8597;
    --accent-soft:rgba(124,92,255,.12);
    --shadow:0 24px 52px rgba(28,34,54,.18);
  }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
body::before{
  content:""; position:fixed; inset:-20% -10% auto -10%; height:60vh; pointer-events:none;
  background:radial-gradient(45% 60% at 20% 0%,var(--accent-soft),transparent 70%),
             radial-gradient(40% 55% at 85% 5%,rgba(52,211,153,.10),transparent 70%);
  filter:blur(10px); z-index:0;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

#app{position:relative;z-index:1;display:grid;grid-template-columns:58px 272px minmax(0,1fr) 306px;height:100dvh;min-height:0}
#rail{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;
  border-right:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent 80%);
}
.rbtn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--dim);
  transition:background .16s,color .16s,transform .16s;position:relative;
}
.rbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rbtn:hover{background:var(--panel2);color:var(--ink)}
.rbtn.on{background:var(--accent-soft);color:var(--accent)}
.rbtn:active{transform:scale(.94)}
.rspacer{flex:1}
.rdot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

#side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.sidehead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.brand{font-size:17px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:2px}
.brand b{color:var(--accent)}
.vaultline{font-size:11px;color:var(--dim2);margin-top:2px}
.sidehead .grow{flex:1}
.quick{display:grid;grid-template-columns:1fr auto auto;gap:6px;padding:0 12px 10px}
.quick button{
  border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;
  font-size:12.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;
}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.quick #qNew{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.quick #qNew:hover{filter:brightness(1.08);color:#fff}
.sidebody{flex:1;overflow:auto;padding:0 8px 12px}
.sidefoot{border-top:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim2)}
.sidefoot .grow{flex:1}
.navrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13.5px;color:var(--ink);width:100%;text-align:left}
.navrow:hover{background:var(--panel2)}
.navrow.on{background:var(--accent-soft);color:var(--accent)}
.navrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.navrow .n{margin-left:auto;font-size:11px;color:var(--dim2)}
.sec{margin:14px 10px 6px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);font-weight:700;display:flex;align-items:center;gap:6px}
.sec .grow{flex:1}
.sec button{color:var(--dim2);font-size:14px;line-height:1}
.sec button:hover{color:var(--accent)}
.noteitem{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-size:13px;width:100%;text-align:left;color:var(--dim)}
.noteitem:hover{background:var(--panel2);color:var(--ink)}
.noteitem.on{background:var(--accent-soft);color:var(--ink)}
.noteitem .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.noteitem .f{font-size:10px;color:var(--dim2);flex:none}
.noteitem .st{color:var(--warn);flex:none}
.folderrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--dim);width:100%;text-align:left}
.folderrow:hover{background:var(--panel2);color:var(--ink)}
.folderrow.on{background:var(--accent-soft);color:var(--accent)}
.folderrow .c{margin-left:auto;font-size:11px;color:var(--dim2)}
.folderrow .tw{width:12px;text-align:center;color:var(--dim2);font-size:10px}
.tagchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;border:1px solid var(--line);color:var(--dim);margin:2px 3px 2px 0;background:var(--panel2)}
.tagchip:hover{border-color:var(--accent);color:var(--accent)}
.tagchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.emptyhint{padding:10px 12px;font-size:12px;color:var(--dim2);line-height:1.5}

#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#top{
  display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5;
}
#top .grow{flex:1}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim2);min-width:0}
.crumbs b{font-weight:600;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw}
.modes{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px}
.modes button{padding:5px 11px;border-radius:8px;font-size:12px;color:var(--dim)}
.modes button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--dim);flex:none}
.iconbtn:hover{background:var(--panel2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.iconbtn.on{color:var(--warn)}
#menuBtn{display:none}

#doc{display:flex;flex-direction:column;flex:1;min-height:0;padding:18px 26px 0}
#doc[hidden]{display:none}
#title{border:0;background:none;font-size:28px;font-weight:700;letter-spacing:-.5px;padding:0;outline:none;width:100%}
#title::placeholder{color:var(--dim2)}
.docmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;font-size:11.5px;color:var(--dim2)}
.docmeta .pill{border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.docmeta .pill.acc{color:var(--accent);border-color:var(--accent)}
#panes{flex:1;display:grid;grid-template-columns:1fr;gap:18px;min-height:0;padding-bottom:20px}
#panes.split{grid-template-columns:1fr 1fr}
#ed{
  border:0;background:none;outline:none;resize:none;width:100%;height:100%;min-height:0;
  font-family:var(--mono);font-size:calc(var(--size) - 1px);line-height:1.75;caret-color:var(--accent);tab-size:2;
}
#pv{overflow:auto;min-height:0;padding-right:4px}
body[data-mode="edit"] #pv{display:none}
body[data-mode="read"] #ed{display:none}
body[data-mode="read"] #panes{grid-template-columns:1fr}

.empty{flex:1;display:grid;place-items:center;text-align:center;padding:30px}
.empty[hidden]{display:none}
.empty .in{max-width:420px}
.empty h2{margin:0 0 8px;font-size:22px;letter-spacing:-.4px}
.empty p{margin:0 0 16px;color:var(--dim);font-size:13.5px;line-height:1.6}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;padding:1px 6px;border-radius:5px;color:var(--dim);background:var(--panel2)}

#status{display:flex;align-items:center;gap:14px;padding:7px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim2);background:var(--panel)}
#status .grow{flex:1}
#updChip{background:var(--accent);color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600}

#right{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.rtabs{display:flex;gap:4px;padding:10px 10px 0}
.rtabs button{padding:6px 12px;font-size:12px;color:var(--dim);border-radius:8px 8px 0 0}
.rtabs button.on{color:var(--ink);background:var(--panel2)}
#rbody{flex:1;overflow:auto;padding:12px}
.linkcard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.linkcard:hover{border-color:var(--accent)}
.linkcard .lc-t{font-size:12.5px;font-weight:600}
.linkcard .lc-s{font-size:11.5px;color:var(--dim2);margin-top:3px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.linkcard.miss .lc-t{color:var(--warn)}
.outline a{display:block;padding:4px 8px;border-radius:7px;font-size:12.5px;color:var(--dim);text-decoration:none;line-height:1.4}
.outline a:hover{background:var(--panel2);color:var(--ink)}
.outline a[data-lvl="2"]{padding-left:20px;font-size:12px}
.outline a[data-lvl="3"]{padding-left:32px;font-size:11.5px}
.panehint{font-size:12px;color:var(--dim2);line-height:1.6;padding:6px}

.md{font-size:var(--size);line-height:1.72;color:var(--ink);word-wrap:break-word}
.md h1,.md h2,.md h3,.md h4{margin:1.3em 0 .5em;line-height:1.28;letter-spacing:-.3px}
.md h1{font-size:1.75em;border-bottom:1px solid var(--line);padding-bottom:.25em}
.md h2{font-size:1.38em}
.md h3{font-size:1.14em}
.md h4{font-size:1em;color:var(--dim)}
.md p{margin:.75em 0}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.md a:hover{border-bottom-color:var(--accent)}
.md ul,.md ol{padding-left:1.4em;margin:.7em 0}
.md li{margin:.28em 0}
.md li.task{list-style:none;margin-left:-1.25em;display:flex;gap:.55em;align-items:flex-start}
.md li.task input{margin-top:.42em;accent-color:var(--accent)}
.md li.task.done{color:var(--dim2);text-decoration:line-through}
.md blockquote{margin:.9em 0;padding:.15em 0 .15em 1em;border-left:3px solid var(--accent);color:var(--dim);background:var(--accent-soft);border-radius:0 8px 8px 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--panel2);padding:.14em .38em;border-radius:5px;border:1px solid var(--line)}
.md pre{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto;margin:.9em 0}
.md pre code{background:none;border:0;padding:0;font-size:.86em;line-height:1.6}
.md hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.md table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.93em}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.md th{background:var(--panel2);font-weight:600}
.md img{max-width:100%;border-radius:10px}
.md .wl{color:var(--accent);background:var(--accent-soft);border-bottom:0;border-radius:6px;padding:.05em .35em;cursor:pointer}
.md .wl.miss{color:var(--warn);background:rgba(251,191,36,.14);border-bottom:1px dashed var(--warn)}
.md .inline-tag{color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:.05em .35em;font-size:.9em}

#scrim{position:fixed;inset:0;background:rgba(4,6,12,.62);backdrop-filter:blur(3px);z-index:40}
#dlg{
  position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 28px));max-height:min(86dvh,760px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
}
#dlg[hidden],#scrim[hidden]{display:none}
#dlg.wide{width:min(760px,calc(100vw - 28px))}
#dlgBody{display:flex;flex-direction:column;min-height:0;flex:1}
.dlghead{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlghead h3{margin:0;font-size:15px;font-weight:650}
.dlghead .grow{flex:1}
.dlgbody{padding:16px 18px;overflow:auto;flex:1}
.dlgfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.dlgfoot .grow{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--err);border-color:rgba(248,113,113,.4)}
.btn.danger:hover{background:rgba(248,113,113,.12);color:var(--err);border-color:var(--err)}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;font-weight:600;letter-spacing:.02em}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);outline:none;font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--dim2);line-height:1.55;margin:-4px 0 12px}
.listrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel2);width:100%;text-align:left}
.listrow:hover{border-color:var(--accent)}
.listrow .lr-t{font-size:13px;font-weight:600}
.listrow .lr-s{font-size:11.5px;color:var(--dim2);margin-top:2px;line-height:1.45}
.listrow .grow{flex:1}
.listrow .chev{color:var(--dim2)}

.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:6px 0 4px}
.pinpad button{padding:15px 0;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-size:19px;font-weight:600}
.pinpad button:hover{border-color:var(--accent);color:var(--accent)}
.pinpad button:active{transform:scale(.97)}
.pindots{display:flex;gap:11px;justify-content:center;margin:6px 0 16px;height:16px}
.pindots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2);transition:.15s}
.pindots i.f{background:var(--accent);border-color:var(--accent);transform:scale(1.05)}
.pindots.err i{border-color:var(--err);background:rgba(248,113,113,.2)}
.pinmsg{text-align:center;font-size:12px;color:var(--dim2);min-height:18px;margin-bottom:6px}
.pinmsg.bad{color:var(--err)}
.vaulthero{text-align:center;margin-bottom:6px}
.vaulthero .lk{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 10px}
.vaulthero .lk svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7}
.vaulthero h3{margin:0 0 4px}
.vaulthero p{margin:0;font-size:12.5px;color:var(--dim)}

.palinput{width:100%;padding:14px 18px;border:0;border-bottom:1px solid var(--line);background:none;outline:none;font-size:15px}
.palinput::placeholder{color:var(--dim2)}
.pallist{overflow:auto;padding:8px;flex:1;min-height:0}
.palitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;width:100%;text-align:left;color:var(--dim)}
.palitem:hover,.palitem.on{background:var(--accent-soft);color:var(--ink)}
.palitem .pi-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palitem .pi-k{font-size:10.5px;color:var(--dim2);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.snippet{font-size:11.5px;color:var(--dim2);margin-top:3px;line-height:1.45}
mark{background:rgba(124,92,255,.28);color:inherit;border-radius:3px;padding:0 2px}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);z-index:60;opacity:0;pointer-events:none;
  border:1px solid var(--line2);color:var(--ink);border-radius:12px;padding:10px 16px;font-size:12.5px;
  box-shadow:var(--shadow);transition:.22s;max-width:min(440px,88vw);text-align:center;
  backdrop-filter:blur(12px);background-color:color-mix(in srgb,var(--panel) 92%,transparent);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

#graphwrap{position:fixed;inset:0;z-index:41;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(6px)}
#graphwrap[hidden]{display:none}
#graphbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
#graphbar .grow{flex:1}
#graph{flex:1;display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#graph.drag{cursor:grabbing}
#graphempty{position:absolute;left:24px;right:24px;bottom:72px;text-align:center;color:var(--dim);font-size:13px;line-height:1.55;pointer-events:none}
#graphempty strong{display:block;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:5px}
.glegend{font-size:11px;color:var(--dim2)}

.setsec{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px;background:var(--panel2)}
.setsec h4{margin:0 0 3px;font-size:13px}
.setsec .sub{font-size:11.5px;color:var(--dim2);line-height:1.5;margin-bottom:10px}
.rowset{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.rowset .grow{flex:1}
.sw{width:44px;height:26px;border-radius:20px;background:var(--line2);position:relative;flex:none;transition:.18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(18px)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:9px;border:2px solid transparent}
.swatch.on{border-color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:9px;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}

@media (max-width:1180px){
  #app{grid-template-columns:58px 252px minmax(0,1fr)}
  #right{display:none}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #rail{
    position:fixed;bottom:0;left:0;right:0;height:58px;flex-direction:row;justify-content:space-around;
    padding:0 6px;border-right:0;border-top:1px solid var(--line);z-index:30;

<script>
'use strict';
/* UNote - part 1: helpers, storage, crypto, markdown, rendering. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const VERSION = '1.0.12';
const APP = 'UNote';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const nowMs = () => Date.now();
const MIN = 60000, HOUR = 3600000, DAY = 86400000;

function toast(msg, ms) {
  const t = $('#toast');

  t.classList.add('on');

  toast._t = setTimeout(() => t.classList.remove('on'), ms || 2400);

function debounce(fn, ms) { let t; return function () { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); }; }
function fmtWhen(ts) {
  if (!ts) return '';
  const d = new Date(ts), diff = nowMs() - ts;
  if (diff < MIN) return 'just now';
  if (diff < HOUR) return Math.floor(diff / MIN) + ' min ago';
  if (diff < DAY && new Date().getDate() === d.getDate()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (diff < DAY * 7) return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
}
const dayKey = d => { const x = d || new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const words = s => (String(s || '').trim().match(/[^\s]+/g) || []).length;

/* ---------------- storage ---------------- */
const DB_NAME = 'unote', DB_VER = 2;
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('notes')) {
        const s = d.createObjectStore('notes', { keyPath: 'id' });
        s.createIndex('updated', 'updated');
      }
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
      if (!d.objectStoreNames.contains('media')) {
        const ms = d.createObjectStore('media', { keyPath: 'id' });
        ms.createIndex('note', 'noteId');
      }

    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);

}
const store = (n, mode) => db.transaction(n, mode || 'readonly').objectStore(n);
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbAll = n => req(store(n).getAll());
const dbPut = (n, v) => req(store(n, 'readwrite').put(v));
const dbDel = (n, k) => req(store(n, 'readwrite').delete(k));
const kvGet = async k => { const r = await req(store('kv').get(k)); return r ? r.v : undefined; };
const kvSet = (k, v) => dbPut('kv', { k: k, v: v });

/* ---------------- crypto (the Vault) ---------------- */
const te = new TextEncoder(), td = new TextDecoder();
const KDF_ITER = 200000;
function toB64(buf) {
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(str) {
  const s = atob(str), b = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b;
}
async function deriveKey(pin, saltB64, iter) {
  const base = await crypto.subtle.importKey('raw', te.encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: fromB64(saltB64), iterations: iter || KDF_ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

async function aesEnc(key, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, te.encode(String(text)));
  return { iv: toB64(iv), ct: toB64(ct) };
}
async function aesDec(key, ivB64, ctB64) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(ivB64) }, key, fromB64(ctB64));
  return td.decode(pt);
}
const randSalt = () => toB64(crypto.getRandomValues(new Uint8Array(16)));

/* ---------------- state ---------------- */
const S = {
  notes: [],            // plain notes (vault:false)
  vault: { on: false, key: null, salt: '', verifier: null, notes: [], plain: [], tries: 0, until: 0 },
  settings: { theme: 'dark', accent: '#7c5cff', size: 16, mode: 'split', autolock: 2, onboarded: false, sort: 'updated' },
  current: null,
  folder: '',
  tag: '',
  view: 'notes',        // notes | fav | trash | vault | tags
  paletteQuery: '',
  right: 'links',
  dirty: false,
};

const allNotes = () => (S.view === 'vault' ? S.vault.plain : S.notes);
/* The Vault is a room, not a filter: while it is closed its notes are not in hand at all. */
function vaultList() { return (S.vault.key && S.view === 'vault') ? S.vault.plain : []; }
const findNote = id => S.notes.find(n => n.id === id) || S.vault.plain.find(n => n.id === id) || null;
const findTitle = t => {
  const k = String(t || '').trim().toLowerCase();
  if (!k) return null;
  return allNotes().find(n => (n.title || '').trim().toLowerCase() === k) || null;
};
const tagOf = body => {
  const out = new Set();
  String(body || '').replace(/(^|[\s(])#([A-Za-z0-9][\w\/-]{0,40})/g, (m, a, t) => { out.add(t); return m; });
  return Array.from(out);
};

  const out = [];
  String(body || '').replace(/\[\[([^\]|]*)(?:\|[^\]]*)?\]\]/g, (m, t) => { const v = t.trim(); if (v && out.indexOf(v) < 0) out.push(v); return m; });
  return out;
};

/* ---------------- markdown ---------------- */
function inlineMd(src, noteById) {
  const look = typeof noteById === 'function' ? noteById : t => findTitle(t);
  let s = esc(src);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => '<img alt="' + alt + '" src="' + url + '">');
  s = s.replace(/\[([^\]]+)\]\(((?:https?|unote-media):[^)\s]+)\)/g, (m, t, url) => '<a href="' + url + '" target="_blank" rel="noopener">' + t + '</a>');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, target, label) => {
    const t = target.trim();
    const hit = look(t);
    return '<a class="wl' + (hit ? '' : ' miss') + '" data-w="' + esc(t) + '">' + esc(label || t) + '</a>';
  });
  s = s.replace(/(^|[\s(])#([A-Za-z0-9][\w\/-]{0,40})/g,
    (m, pre, tag) => pre + '<span class="inline-tag" data-tag="' + tag + '">#' + tag + '</span>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/(https?:\/\/[^\s<]+)/g, m => /<a /.test(m) ? m : '<a href="' + m + '" target="_blank" rel="noopener">' + m + '</a>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + codes[+i] + '</code>');
  return s;
}

function md(src) {
  const byTitle = t => findTitle(t);
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  let out = '', i = 0, inList = false, listType = '';
  const closeList = () => { if (inList) { out += '</' + listType + '>'; inList = false; } };

  while (i < lines.length) {
    const line = lines[i];

    if (/^```/.test(line)) {
      const lang = line.slice(3).trim();
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      closeList();
      out += '<pre><code data-lang="' + esc(lang) + '">' + esc(buf.join('\n')) + '</code></pre>';
      continue;
    }

    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      closeList();
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(line);
      i += 2;
      let body = '';
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        body += '<tr>' + cells(lines[i]).map(c => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>';
        i++;
      }
      out += '<table><thead><tr>' + head.map(h => '<th>' + inlineMd(h) + '</th>').join('') + '</tr></thead><tbody>' + body + '</tbody></table>';
      continue;
    }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      closeList();
      const lv = Math.min(h[1].length, 4);
      out += '<h' + lv + '>' + inlineMd(h[2]) + '</h' + lv + '>';
      i++; continue;
    }

    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { closeList(); out += '<hr>'; i++; continue; }

    if (/^\s*>\s?/.test(line)) {
      closeList();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out += '<blockquote>' + md(buf.join('\n')) + '</blockquote>';
      continue;
    }

    const task = line.match(/^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/);
    if (task) {
      if (!inList || listType !== 'ul') { closeList(); out += '<ul>'; inList = true; listType = 'ul'; }
      const done = task[1].toLowerCase() === 'x';
      out += '<li class="task' + (done ? ' done' : '') + '"><input type="checkbox" disabled' + (done ? ' checked' : '') + '><span>' + inlineMd(task[2]) + '</span></li>';
      i++; continue;
    }

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ul) {
      if (!inList || listType !== 'ul') { closeList(); out += '<ul>'; inList = true; listType = 'ul'; }
      out += '<li>' + inlineMd(ul[1]) + '</li>';
      i++; continue;
    }

    const ol = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if (ol) {
      if (!inList || listType !== 'ol') { closeList(); out += '<ol>'; inList = true; listType = 'ol'; }
      out += '<li>' + inlineMd(ol[2]) + '</li>';
      i++; continue;
    }

    if (!line.trim()) { closeList(); i++; continue; }

    closeList();
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|>\s?|```|\s*[-*+]\s|\s*\d+[.)]\s|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out += '<p>' + inlineMd(buf.join('\n')).replace(/\n/g, '<br>') + '</p>';
  }
  closeList();
  return out;
}

function newNote(extra) {
  const t = new Date();
  const n = Object.assign({
    id: uid(), title: '', body: '', folder: '', fav: false, created: nowMs(), updated: nowMs(), deleted: 0,
  }, extra || {});
  return n;
}

async function saveNote(note, opts) {
  if (!note) return;
  note.updated = nowMs();
  if (note.vault) {
    if (!S.vault.key) return;
    const box = await aesEnc(S.vault.key, JSON.stringify({ title: note.title, body: note.body, folder: note.folder }));
    const rec = { id: note.id, vault: true, created: note.created, updated: note.updated, iv: box.iv, ct: box.ct };
    const idx = S.vault.notes.findIndex(r => r.id === note.id);
    if (idx >= 0) S.vault.notes[idx] = rec; else S.vault.notes.push(rec);
    await dbPut('notes', rec);
  } else {
    await dbPut('notes', note);
  }
  if (!opts || !opts.quiet) setSaved();
}

/* ---------------- graph ---------------- */
const G = { nodes: [], edges: [], raf: 0, scale: 1, tx: 0, ty: 0, drag: null, canvas: null, ctx: null, last: 0 };
function openGraph() {
  const wrap = $('#graphwrap');
  wrap.hidden = false;
  G.canvas = $('#graph');
  G.ctx = G.canvas.getContext('2d');
  const notes = allNotes().filter(n => !n.deleted);
  const byTitle = {};
  notes.forEach(n => { byTitle[noteTitle(n).toLowerCase()] = n; });
  const W = G.canvas.clientWidth || window.innerWidth, H = G.canvas.clientHeight || window.innerHeight;
  G.nodes = notes.map((n, i) => ({
    id: n.id, title: noteTitle(n), vault: !!n.vault,
    x: W / 2 + Math.cos(i * 2.399) * (60 + i * 9), y: H / 2 + Math.sin(i * 2.399) * (60 + i * 9),
    vx: 0, vy: 0, r: 5 + Math.min(9, wikiOut(n.body).length),
  }));
  const idx = {}; G.nodes.forEach((nd, i) => idx[nd.id] = i);
  G.edges = [];
  notes.forEach(n => wikiOut(n.body).forEach(t => {
    const hit = byTitle[t.toLowerCase()];
    if (hit && hit.id !== n.id) G.edges.push([idx[n.id], idx[hit.id]]);
  }));
  const legend = $('#graphlegend');
  legend.textContent = G.nodes.length + ' note' + (G.nodes.length === 1 ? '' : 's') + ' · ' +
    (G.edges.length
      ? G.edges.length + ' link' + (G.edges.length === 1 ? '' : 's') + ' · tap a dot to open it'
      : 'no links yet');
  const empty = $('#graphempty');
  if (empty) empty.hidden = G.edges.length > 0;
  G.scale = 1; G.tx = 0; G.ty = 0;
  sizeGraph();
  if (!G.raf) { G.last = performance.now(); G.raf = requestAnimationFrame(graphTick); }
}
function sizeGraph() {
  const c = G.canvas; if (!c) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  G.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function closeGraph() {
  $('#graphwrap').hidden = true;
  cancelAnimationFrame(G.raf); G.raf = 0;
}
function graphTick(t) {
  const dt = Math.min(32, t - G.last) / 16.666; G.last = t;
  const c = G.ctx, W = G.canvas.clientWidth, H = G.canvas.clientHeight;
  if (!G.nodes.length) { G.raf = requestAnimationFrame(graphTick); return; }
  // forces
  for (let i = 0; i < G.nodes.length; i++) {
    const a = G.nodes[i];
    for (let j = i + 1; j < G.nodes.length; j++) {
      const b = G.nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || 1;
      if (d2 > 90000) continue;
      const f = 1400 / d2;
      const d = Math.sqrt(d2);
      a.vx -= (dx / d) * f * dt; a.vy -= (dy / d) * f * dt;
      b.vx += (dx / d) * f * dt; b.vy += (dy / d) * f * dt;
    }
    // gentle pull to centre
    a.vx += (W / 2 - a.x) * 0.0016 * dt; a.vy += (H / 2 - a.y) * 0.0016 * dt;
  }
  G.edges.forEach(e => {
    const a = G.nodes[e[0]], b = G.nodes[e[1]];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, k = (d - 92) * 0.0055;
    a.vx += (dx / d) * k * dt; a.vy += (dy / d) * k * dt;
    b.vx -= (dx / d) * k * dt; b.vy -= (dy / d) * k * dt;
  });
  G.nodes.forEach(nd => {
    if (G.drag && G.drag.node === nd) { nd.vx = nd.vy = 0; return; }
    nd.vx *= 0.86; nd.vy *= 0.86;
    nd.x += nd.vx * dt; nd.y += nd.vy * dt;
    if (nd.x < 20) nd.x = 20; if (nd.x > W - 20) nd.x = W - 20;
    if (nd.y < 20) nd.y = 20; if (nd.y > H - 20) nd.y = H - 20;
  });
  // draw
  const cs = getComputedStyle(document.body);
  const line = cs.getPropertyValue('--line2').trim() || '#333';
  const ink = cs.getPropertyValue('--ink').trim() || '#fff';
  const acc = S.settings.accent;
  const hot = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(acc) ? acc : '#7c5cff';
  c.clearRect(0, 0, W, H);
  c.save(); c.translate(G.tx, G.ty); c.scale(G.scale, G.scale);
  c.strokeStyle = line; c.lineWidth = 1;
  G.edges.forEach(e => {
    const a = G.nodes[e[0]], b = G.nodes[e[1]];
    if (!a || !b) return;
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
  });
  G.nodes.forEach(nd => {
    c.beginPath(); c.arc(nd.x, nd.y, nd.r, 0, 6.2832);
    c.fillStyle = nd.vault ? '#fbbf24' : hot; c.globalAlpha = 0.9; c.fill(); c.globalAlpha = 1;
    c.fillStyle = ink; c.font = '11px -apple-system,Segoe UI,sans-serif'; c.textAlign = 'center';
    const label = nd.title.length > 18 ? nd.title.slice(0, 17) + '…' : nd.title;
    c.globalAlpha = 0.86; c.fillText(label, nd.x, nd.y + nd.r + 13); c.globalAlpha = 1;
  });
  c.restore();
  G.raf = requestAnimationFrame(graphTick);
}
function graphHit(mx, my) {
  const x = (mx - G.tx) / G.scale, y = (my - G.ty) / G.scale;
  for (let i = G.nodes.length - 1; i >= 0; i--) {
    const nd = G.nodes[i], d = Math.hypot(nd.x - x, nd.y - y);
    if (d < nd.r + 10) return nd;
  }
  return null;
}

let palMode = 'command', palItems = [], palSel = 0;
function palette(mode) {
  palMode = mode || 'command';
  palSel = 0;
  const d = dialog({
    cls: 'wide',
    body: '<input class="palinput" id="palQ" placeholder="' +
      (palMode === 'search' ? 'Search every note…' : 'Jump to a note, or type a command…') + '" autocomplete="off">' +
      '<div class="pallist" id="palList"></div>',
    foot: '<span class="hint" style="margin:0">↑ ↓ to move · Enter to open · Esc to close</span>',
  });
  const q = $('#palQ', d);
  q.addEventListener('input', () => { palSel = 0; drawPalette(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { palSel = Math.min(palItems.length - 1, palSel + 1); drawPalette(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); drawPalette(); e.preventDefault(); }
    else if (e.key === 'Enter') { const it = palItems[palSel]; if (it) it.run(); e.preventDefault(); }
  });
  drawPalette();
  setTimeout(() => q.focus(), 30);
}
function drawPalette() {
  const q = ($('#palQ') && $('#palQ').value || '').trim();
  const ql = q.toLowerCase();
  const list = $('#palList');
  if (!list) return;
  palItems = [];
  if (palMode === 'command') {
    COMMANDS.filter(c => !ql || c.k.toLowerCase().includes(ql))
      .forEach(c => palItems.push({ title: c.k, kind: 'Command', run: () => { closeDialog(); c.run(); } }));
    sortNotes(allNotes().filter(n => !n.deleted)).filter(n => !ql || noteTitle(n).toLowerCase().includes(ql))
      .slice(0, 40)
      .forEach(n => palItems.push({ title: noteTitle(n), kind: n.vault ? 'Vault' : 'Note', run: () => { closeDialog(); openNote(n.id); } }));
  } else {
    const hits = [];
    allNotes().forEach(n => {
      if (n.deleted) return;
      const t = noteTitle(n), b = String(n.body || '');
      const inT = t.toLowerCase().includes(ql), inB = ql && b.toLowerCase().includes(ql);
      if (!ql || inT || inB) {
        let snippet = '';
        if (inB) {
          const i = b.toLowerCase().indexOf(ql);
          snippet = (i > 40 ? '…' : '') + b.slice(Math.max(0, i - 40), i + 90).replace(/\s+/g, ' ');
        } else snippet = b.replace(/\s+/g, ' ').slice(0, 100);
        hits.push({ title: t, kind: n.vault ? 'Vault' : 'Note', snippet: snippet, run: () => { closeDialog(); openNote(n.id); } });
      }
    });
    palItems = hits.slice(0, 60);
  }
  list.innerHTML = palItems.length ? palItems.map((it, i) =>
    '<button class="palitem' + (i === palSel ? ' on' : '') + '" data-pal="' + i + '">' +
    '<span class="pi-t">' + esc(it.title) + (it.snippet ? '<span class="snippet" style="display:block">' + esc(it.snippet) + '</span>' : '') + '</span>' +
    '<span class="pi-k">' + esc(it.kind) + '</span></button>').join('')
    : '<div class="panehint">Nothing matched.</div>';
  $$('#palList .palitem').forEach(b => b.addEventListener('click', () => {
    const it = palItems[+b.dataset.pal]; if (it) it.run();
  }));
}

function vaultMeta() { return kvGet('vault').then(v => v || null); }

async function setupVaultPin(pin, ui, onDone) {
  const salt = randSalt();
  const key = await deriveKey(pin, salt, KDF_ITER);
  const verifier = await aesEnc(key, 'unote-vault-v1');
  S.vault.salt = salt; S.vault.key = key; S.vault.on = true;
  S.vault.verifier = { iv: verifier.iv, ct: verifier.ct };
  await kvSet('vault', { on: true, salt: salt, iter: KDF_ITER, verifier: S.vault.verifier });
  await decryptVault();
  onDone && onDone();
}

/* ---------------- PIN entry with no keyboard ---------------- */

/* Two entries on the same number pad that unlocks the Vault. Nothing is typed into a text
   field, so no keyboard opens and the phone's password manager has nothing to offer. */
function askPinPair(o) {
  const step = first => {
    closeDialog();
    pinDialog({
      title: first ? 'Type the PIN once more' : o.title,
      sub: first ? 'The same digits, to be sure.' : o.sub,
      extra: first
        ? '<div class="hint" style="text-align:center;margin:10px 0 0">A PIN cannot be recovered.</div>'
        : '<div class="hint" style="text-align:center;margin:10px 0 0">Just the keypad - no keyboard, no password pop-up.</div>' +
          '<div style="text-align:center;margin-top:10px"><button class="btn ghost" id="pinPairCancel" style="font-size:12px;color:var(--dim2)">Not now</button></div>',
      onPin: (pin, ui) => {
        if (!first) { step(pin); return; }
        if (pin !== first) {
          closeDialog();
          toast('Those two did not match. Start again.', 3600);
          setTimeout(() => step(null), 420);
          return;
        }
        closeDialog();
        o.onPin(first);
      },
    });
    const c = document.getElementById('pinPairCancel');
    if (c) c.addEventListener('click', () => closeDialog());
  };
  step(null);
}

function askNewPin(done) {
  askPinPair({
    title: 'Create a Vault PIN',
    sub: '4 to 8 digits. It is the only key to the Vault.',
    onPin: async pin => {
      toast('Sealing the Vault...', 1800);
      try { await setupVaultPin(pin); done && done(); }
      catch (e) { toast('Could not create it: ' + e.message, 4200); }
    },
  });
}

async function unlockDialog(after) {
  const meta = await vaultMeta();
  if (!meta || !meta.on) { askNewPin(after); return; }
  const guard = (await kvGet('vaultguard')) || { tries: 0, until: 0 };
  const waitLeft = Math.max(0, (guard.until || 0) - nowMs());
  if (waitLeft > 0) {
    toast('Too many tries. Wait ' + Math.ceil(waitLeft / 1000) + 's.');
    return;
  }
  pinDialog({
    title: 'Open the Vault',
    sub: 'Enter your PIN',
    onPin: async (pin, ui) => {
      try {
        const key = await deriveKey(pin, meta.salt, meta.iter || KDF_ITER);
        await aesDec(key, meta.verifier.iv, meta.verifier.ct);
        S.vault.key = key; S.vault.salt = meta.salt; S.vault.verifier = meta.verifier;
        await kvSet('vaultguard', { tries: 0, until: 0 });
        await decryptVault();
        closeDialog();
        toast('Vault open. It locks itself when you leave.');
        if (after) after(); else { goVault(); }
      } catch (e) {
        const g = ((await kvGet('vaultguard')) || { tries: 0 });
        g.tries = (g.tries || 0) + 1;
        if (g.tries >= 5) { g.until = nowMs() + Math.min(120000, 15000 * (g.tries - 4)); g.tries = 0; }
        await kvSet('vaultguard', g);
        ui.bad(g.until ? 'Wrong PIN. Locked for a moment.' : 'Wrong PIN (' + (5 - (g.tries || 0)) + ' tries left)');
      }
    },
    extra: '<div style="text-align:center"><button class="btn ghost" id="vaultForgot" style="font-size:12px;color:var(--dim2)">Forgot the PIN? Reset the Vault</button></div>',
  });
  const f = $('#vaultForgot');
  if (f) f.addEventListener('click', () => { closeDialog(); resetVault(); });
}

async function decryptVault() {
  if (!S.vault.key) { S.vault.plain = []; return; }
  const recs = await dbAll('notes');
  const vrecs = recs.filter(r => r.vault);
  const out = [];
  for (const r of vrecs) {
    try {
      const j = JSON.parse(await aesDec(S.vault.key, r.iv, r.ct));
      out.push({ id: r.id, vault: true, title: j.title || '', body: j.body || '', folder: j.folder || '', fav: false, created: r.created, updated: r.updated, deleted: 0 });
    } catch (e) { /* a record this key cannot read stays sealed */ }
  }
  S.vault.notes = vrecs;
  S.vault.plain = out.sort((a, b) => b.updated - a.updated);
}

function goVault() {
  if (!S.vault.key) { S.view = 'vault'; renderSide(); unlockDialog(() => { S.view = 'vault'; renderSide(); }); return; }
  S.view = 'vault'; S.folder = ''; S.tag = '';
  renderSide();
}

function lockVault(quiet) {
  if (!S.vault.key) return;
  S.vault.key = null;
  S.vault.plain = [];
  if (S.current && S.current.vault) { S.current = null; renderDoc(); }
  if (S.view === 'vault') { S.view = 'notes'; S.folder = ''; S.tag = ''; }
  const gw = $('#graphwrap');
  if (gw && !gw.hidden) closeGraph();
  mediaRevokeAll();
  renderSide();
  if (!quiet) toast('Vault closed. Everything inside is locked away.');
}

  const unlocked = !!S.vault.key;
  const d = dialog({
    title: 'Reset the Vault',
    body: '<div class="hint" style="margin-top:0">A reset takes the PIN off the Vault and empties it. Your other notes are not touched, and nothing outside the Vault changes.</div>' +
      '<div class="hint">The PIN is the only key to what is inside. Nobody - not this app, not anyone - can read those notes without it, so a reset cannot keep them' + (unlocked ? '.' : ' - that is what makes the Vault private.') + '</div>' +
      (unlocked ? '<button class="listrow" id="rvSave" style="margin-top:10px"><span class="grow"><span class="lr-t">Save the Vault notes first</span><span class="lr-s">One plain text file, so you can keep them.</span></span><span class="chev">\u203a</span></button>' : '') +
      '<label class="field" style="margin-top:12px"><span>Type RESET to confirm</span><input id="rvWord" autocomplete="off" placeholder="RESET"></label>' +
      '<div class="pinmsg" id="rvMsg"></div>',

function saveVaultText() {
  const notes = S.vault.plain.slice();
  if (!notes.length) { toast('The Vault is empty - there is nothing to save.'); return; }
  const text = notes.map(n => '# ' + noteTitle(n) + '\n\n' + (n.body || '')).join('\n\n---\n\n');
  downloadText('unote-vault-' + dayKey() + '.txt', text, 'text/plain');
  toast(notes.length + (notes.length === 1 ? ' note' : ' notes') + ' from the Vault saved as a text file.', 4200);
}

async function wipeVault() {
  const recs = await dbAll('notes');
  for (const r of recs) if (r.vault) await dbDel('notes', r.id);
  await kvSet('vault', null);
  await kvSet('vaultguard', { tries: 0, until: 0 });
  S.vault = { on: false, key: null, salt: '', verifier: null, notes: [], plain: [], tries: 0, until: 0 };
  if (S.view === 'vault') S.view = 'notes';
  renderSide(); renderDoc();
}

function vaultActivity() {

}

}

async function changePin() {
  const meta = await vaultMeta();
  if (!meta || !meta.on) { askNewPin(() => toast('Vault PIN set.')); return; }
  if (!S.vault.key) { unlockDialog(() => changePin()); return; }
  askPinPair({
    title: 'Change the Vault PIN',
    sub: 'Pick a new 4 to 8 digit PIN. Everything in the Vault is resealed with it.',
    onPin: async p1 => {
      toast('Resealing the Vault...', 2000);
      try {
        const plain = S.vault.plain.slice();
        const salt = randSalt();
        const key = await deriveKey(p1, salt, KDF_ITER);
        const verifier = await aesEnc(key, 'unote-vault-v1');
        for (const n of plain) {
          const box = await aesEnc(key, JSON.stringify({ title: n.title, body: n.body, folder: n.folder }));
          await dbPut('notes', { id: n.id, vault: true, created: n.created, updated: n.updated, iv: box.iv, ct: box.ct });
        }
        S.vault.key = key; S.vault.salt = salt;
        S.vault.verifier = { iv: verifier.iv, ct: verifier.ct };
        await kvSet('vault', { on: true, salt: salt, iter: KDF_ITER, verifier: S.vault.verifier });
        await decryptVault();
        toast('PIN changed. ' + plain.length + ' vault note' + (plain.length === 1 ? '' : 's') + ' resealed.', 4000);
      } catch (e) {
        toast('Could not change it: ' + e.message, 4200);
      }
    },
  });
}

  return (typeof window !== 'undefined' && window.UNoteFile &&

}

/* ---------------- export / transfer / import ---------------- */
async function buildBundle() {
  const meta = (await vaultMeta()) || null;
  const recs = await dbAll('notes');
  return {
    app: APP, kind: 'backup', version: VERSION, at: new Date().toISOString(),
    settings: { theme: S.settings.theme, accent: S.settings.accent, size: S.settings.size, mode: S.settings.mode, autolock: S.settings.autolock, sort: S.settings.sort },
    notes: recs.filter(r => !r.vault),
    media: await bundleMedia(),
    vault: meta && meta.on ? { on: true, salt: meta.salt, iter: meta.iter, verifier: meta.verifier, notes: recs.filter(r => r.vault) } : { on: false },
  };
}

function downloadText(name, text, type) {
  const blob = new Blob([text], { type: type || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function exportAll() {
  try {
    const bundle = await buildBundle();
    const name = 'unote-' + dayKey() + '.unote.json';
    const json = JSON.stringify(bundle, null, 1);
    const msg = bundle.notes.length + ' note' + (bundle.notes.length === 1 ? '' : 's') +
      (bundle.vault.on ? ' + ' + bundle.vault.notes.length + ' sealed in the Vault' : '');
    const nf = nativeFiles();
    if (nf) {
      nf.saveBackup(name, json);
      toast('Exported ' + msg + '. Pick where to keep ' + name + '.', 4600);
      return;
    }
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Exported ' + msg + ' to ' + name, 4600);
  } catch (e) { toast('Export failed: ' + e.message, 4200); }
}

async function pack(str) {
  const bytes = new TextEncoder().encode(str);
  if (typeof CompressionStream === 'undefined') return toB64(bytes);
  const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(cs).arrayBuffer();
  return 'gz:' + toB64(buf);
}
async function unpack(code) {
  const t = String(code || '').trim().replace(/^UNOTE1:/i, '');
  if (t.startsWith('gz:')) {
    const raw = fromB64(t.slice(3));
    const ds = new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new TextDecoder().decode(await new Response(ds).arrayBuffer());
  }
  return new TextDecoder().decode(fromB64(t));
}

async function runImport(text, mode) {
  let bundle;
  try {
    let raw = String(text || '').trim();
    if (!raw) throw new Error('Nothing to import');
    if (/^UNOTE1:/i.test(raw)) raw = await unpack(raw);
    bundle = JSON.parse(raw);
    if (bundle.app !== APP || !Array.isArray(bundle.notes)) throw new Error('That is not a UNote backup');
  } catch (e) { toast('Could not read that: ' + e.message, 4000); return; }

  let added = 0, updated = 0;
  if (mode === 'replace') {
    for (const n of S.notes) await dbDel('notes', n.id);
    for (const r of S.vault.notes) await dbDel('notes', r.id);
    S.notes = []; S.vault.notes = []; S.vault.plain = [];
  }
  for (const n of bundle.notes) {
    const old = S.notes.find(x => x.id === n.id);
    if (old && (old.updated || 0) >= (n.updated || 0)) continue;
    if (old) updated++; else added++;
    await dbPut('notes', n);
  }
  S.notes = (await dbAll('notes')).filter(r => !r.vault);

  if (bundle.vault && bundle.vault.on) {
    const meta = await vaultMeta();
    if (!meta || !meta.on) {
      await kvSet('vault', { on: true, salt: bundle.vault.salt, iter: bundle.vault.iter || KDF_ITER, verifier: bundle.vault.verifier });
      for (const r of bundle.vault.notes || []) await dbPut('notes', r);
      S.vault.key = null;
    } else if (JSON.stringify(meta.verifier) === JSON.stringify(bundle.vault.verifier)) {
      for (const r of bundle.vault.notes || []) await dbPut('notes', r);
    } else {
      toast('Vault skipped: the backup was sealed with a different PIN.', 4600);
    }
  }
  if (bundle.media && bundle.media.length) await pullInMedia(bundle.media);
  if (bundle.settings) {
    Object.assign(S.settings, bundle.settings);
    kvSet('settings', S.settings);
    setTheme(S.settings.theme); setAccent(S.settings.accent);
    document.documentElement.style.setProperty('--size', (S.settings.size || 16) + 'px');
  }
  if (S.vault.key) await decryptVault();
  closeDialog();
  renderSide(); renderDoc();
  let tail = '';
  if (bundle.vault && bundle.vault.on) tail = ' The Vault came across sealed: it opens with the PIN it was sealed with, or you can reset it and start empty.';
  toast('Imported: ' + added + ' new, ' + updated + ' updated.' + tail, 5200);
}

/* ---------------- updates (over the air) ---------------- */

/* The browser copy updates through its service worker. The installed app has no service worker
   and no download manager, so it asks this site for the update file and keeps the newest page
   it finds in the app's own storage; MainActivity serves that copy instead of the one built
   into the APK. */
const OTA_HOME = 'https://anekthegreat.github.io/UNote/';

/* What the last attempt did, so Settings can say it in words instead of guessing. */
let otaState = { at: 0, ok: false, site: '', note: '', tries: 0 };

function cmpVer(a, b) {
  const x = String(a || '0').split('.').map(n => parseInt(n, 10) || 0);
  const y = String(b || '0').split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const d = (x[i] || 0) - (y[i] || 0);
    if (d) return d < 0 ? -1 : 1;
  }
  return 0;
}

function otaBase() {
  const nf = nativeFiles();
  return (nf && typeof nf.savePage === 'function') ? OTA_HOME : '';
}

function otaSummary() {
  if (!otaState.at) return 'Not checked yet in this session.';
  const when = new Date(otaState.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (!otaState.ok) {
    return 'Last try at ' + when + ' did not get through (' + otaState.note + '). It tries again by itself, and whenever you reopen the app.';
  }
  const newer = cmpVer(otaState.site, VERSION) > 0;
  return 'Last check at ' + when + ': reached the site, which offers ' + (otaState.site || VERSION) +
    (newer ? ' - newer than this one.' : ' - so this is the newest.');
}

/* A quiet "Up to date" for a few seconds: proof the check ran, without a pop-up. */
function flashUpToDate() {
  const chip = $('#updChip');
  if (!chip || !chip.hidden) return;
  chip.hidden = false;
  chip.textContent = 'Up to date \u00b7 ' + VERSION;
  setTimeout(() => {
    if (chip.textContent.indexOf('Up to date') === 0) {
      chip.hidden = true;
      chip.textContent = '';
    }
  }, 5000);
}

async function checkUpdate(manual) {
  try {
    const r = await fetch(otaBase() + 'updates.json?t=' + nowMs(), { cache: 'no-store' });
    if (!r.ok) throw new Error('the server answered ' + r.status);
    const j = await r.json();
    otaState = { at: Date.now(), ok: true, site: j.version || '', note: '', tries: otaState.tries + 1 };
    if (cmpVer(j.version, VERSION) > 0) {
      const chip = $('#updChip');
      chip.hidden = false;
      chip.textContent = 'Update ' + j.version + ' ready';
      chip.onclick = () => applyUpdate(j);
      if (manual) toast('Version ' + j.version + ' is ready. Tap the chip to take it.', 4200);
      return 'Version ' + j.version + ' is ready. Tap the chip at the bottom to take it.';
    }
    const chip = $('#updChip');
    chip.hidden = true;
    chip.textContent = '';
    if (otaBase()) flashUpToDate();   // in the installed app only: visible proof the check ran
    return 'You are on the newest version (' + VERSION + '), and the site agrees (' + j.version + ').';
  } catch (e) {
    otaState = { at: Date.now(), ok: false, site: '', note: e.message || 'no answer', tries: otaState.tries + 1 };
    if (manual) toast('Could not check for updates: ' + (e.message || 'no answer'), 4600);
    return 'Could not check for updates: ' + (e.message || 'no answer');
  }
}

/* The boot check could not be one silent attempt: on a real phone the first second after launch
   is often too early for the network. Try again a few times, then again whenever the app comes
   back to the front. */
function watchForUpdates() {
  const delays = [1200, 6000, 20000];
  const attempt = i => {
    if (i >= delays.length) return;
    setTimeout(async () => {
      if (otaState.ok) return;
      await checkUpdate(false);
      if (!otaState.ok) attempt(i + 1);
    }, delays[i]);
  };
  attempt(0);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkUpdate(false);
  });
}

async function applyUpdate(j) {
  const want = (j && j.version) ? j.version : 'the newest version';
  const nf = nativeFiles();
  if (nf && typeof nf.savePage === 'function') {
    toast('Fetching ' + want + '...', 3000);
    try {
      const r = await fetch(OTA_HOME + 'index.html?t=' + nowMs(), { cache: 'no-store' });
      if (!r.ok) throw new Error('the page did not come back (' + r.status + ')');
      const page = await r.text();
      if (page.length < 40000 || page.indexOf("const VERSION = '") < 0) throw new Error('that did not look like UNote');
      nf.savePage(page);
      toast('Update ' + want + ' is in. Reopening...', 2800);
      setTimeout(() => location.replace(location.pathname + '?updated=' + nowMs()), 900);
      return;
    } catch (e) {
      toast('Could not fetch the update: ' + e.message, 4800);
      return;
    }
  }
  toast('Updating to ' + want + '...', 3000);
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) {
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        await reg.update();
        setTimeout(() => location.reload(), 700);
        return;
      }
    }
    location.reload();
  } catch (e) { location.reload(); }
}

/* The way back: drop the fetched page and use the one that came inside the APK. */
function resetBuiltInPage() {
  const nf = nativeFiles();
  if (!nf || typeof nf.resetPage !== 'function') return;
  nf.resetPage();
  closeDialog();
  toast('Back to the built-in version. Reopening...', 2800);
  setTimeout(() => location.replace(location.pathname + '?builtin=' + nowMs()), 900);
}

    gc.classList.add('drag');
  });

    if (!G.drag) return;
    const dx = e.clientX - G.drag.x, dy = e.clientY - G.drag.y;

      G.drag.node.x = (e.clientX - r.left - G.tx) / G.scale;

/* ---------------- editor behaviour ---------------- */
let sugg = null, suggItems = [], suggSel = 0;
function suggestClose() { if (sugg) { sugg.remove(); sugg = null; suggItems = []; } }
function suggestUpdate(el) {
  const pos = el.selectionStart;
  const before = el.value.slice(Math.max(0, pos - 60), pos);
  const m = before.match(/\[\[([^\]\n]*)$/);
  if (!m) { suggestClose(); return; }
  const q = m[1].toLowerCase();
  const items = sortNotes(allNotes().filter(n => !n.deleted))
    .filter(n => noteTitle(n).toLowerCase().includes(q))
    .slice(0, 6);
  if (!items.length) { suggestClose(); return; }
  suggItems = items; suggSel = 0;
  if (!sugg) {
    sugg = document.createElement('div');
    sugg.style.cssText = 'position:fixed;z-index:45;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;max-width:80vw';
    document.body.appendChild(sugg);
  }
  const r = el.getBoundingClientRect();
  sugg.style.left = Math.min(r.left + 20, window.innerWidth - 260) + 'px';
  sugg.style.top = Math.min(r.top + 90, window.innerHeight - 240) + 'px';
  sugg.innerHTML = suggItems.map((n, i) =>
    '<button class="palitem' + (i === suggSel ? ' on' : '') + '" data-sg="' + i + '" style="width:100%">' +
    '<span class="pi-t">' + esc(noteTitle(n)) + '</span><span class="pi-k">' + (n.vault ? 'Vault' : 'Note') + '</span></button>').join('');
  $$('#noop').length;
  Array.from(sugg.children).forEach(b => b.addEventListener('mousedown', ev => {
    ev.preventDefault();
    insertSuggestion(el, suggItems[+b.dataset.sg]);
  }));
}
function insertSuggestion(el, note) {
  const pos = el.selectionStart;
  const before = el.value.slice(0, pos), after = el.value.slice(pos);
  const m = before.match(/\[\[([^\]\n]*)$/);
  if (!m) return;
  const start = before.length - m[0].length;
  const title = noteTitle(note);
  el.value = before.slice(0, start) + '[[' + title + ']]' + after;
  const caret = start + title.length + 4;
  el.setSelectionRange(caret, caret);
  S.current.body = el.value;
  $('#pv').innerHTML = md(el.value);
  queueSave();
  suggestClose();
}
function wrapSel(el, pre, post) {
  const a = el.selectionStart, b = el.selectionEnd;
  const v = el.value;
  el.value = v.slice(0, a) + pre + v.slice(a, b) + post + v.slice(b);
  el.setSelectionRange(a + pre.length, b + pre.length);
  el.dispatchEvent(new Event('input'));
}
function editorKey(e, el) {
  if (sugg && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    suggSel = clamp(suggSel + (e.key === 'ArrowDown' ? 1 : -1), 0, suggItems.length - 1);
    Array.from(sugg.children).forEach((b, i) => b.classList.toggle('on', i === suggSel));
    return;
  }
  if (sugg && e.key === 'Enter') { e.preventDefault(); insertSuggestion(el, suggItems[suggSel]); return; }
  const mod = e.metaKey || e.ctrlKey;
  if (mod && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); wrapSel(el, '**', '**'); return; }
  if (mod && (e.key === 'i' || e.key === 'I') && !e.shiftKey) { e.preventDefault(); wrapSel(el, '*', '*'); return; }
  if (e.key === 'Tab') {
    e.preventDefault();
    const a = el.selectionStart;
    el.value = el.value.slice(0, a) + '  ' + el.value.slice(el.selectionEnd);
    el.setSelectionRange(a + 2, a + 2);
    el.dispatchEvent(new Event('input'));
    return;
  }
  if (e.key === 'Enter') {
    const pos = el.selectionStart;
    const line = el.value.slice(el.value.lastIndexOf('\n', pos - 1) + 1, pos);
    const m = line.match(/^(\s*)([-*+]\s(\[[ xX]\]\s)?|\d+[.)]\s)(.*)$/);
    if (m && !m[4].trim()) { e.preventDefault(); el.value = el.value.slice(0, pos) + '\n' + m[1] + el.value.slice(el.selectionEnd); el.setSelectionRange(pos + 1 + m[1].length, pos + 1 + m[1].length); el.dispatchEvent(new Event('input')); return; }
    if (m) {
      e.preventDefault();
      let bullet = m[2];
      if (/^\d/.test(bullet)) bullet = (parseInt(bullet, 10) + 1) + '. ';
      const ins = '\n' + m[1] + bullet;
      el.value = el.value.slice(0, pos) + ins + el.value.slice(el.selectionEnd);
      el.setSelectionRange(pos + ins.length, pos + ins.length);
      el.dispatchEvent(new Event('input'));
      return;
    }
  }
  setTimeout(() => suggestUpdate(el), 0);
}


/* ---------------- attachments: photos, video, audio, voice memos ---------------- */
const MEDIA = { urls: {} };

function mediaKind(mime, name) {
  const m = String(mime || '');
  if (m.indexOf('image/') === 0) return 'image';
  if (m.indexOf('video/') === 0) return 'video';
  if (m.indexOf('audio/') === 0) return 'audio';
  const ext = String(name || '').toLowerCase().split('.').pop();
  if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'heic', 'heif', 'avif'].indexOf(ext) >= 0) return 'image';
  if (['mp4', 'mov', 'webm', 'm4v', '3gp'].indexOf(ext) >= 0) return 'video';
  if (['mp3', 'm4a', 'wav', 'ogg', 'oga', 'aac', 'opus', 'amr', 'weba'].indexOf(ext) >= 0) return 'audio';
  return 'file';
}

async function mediaEncrypt(key, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, bytes);
  return { iv: toB64(iv), ct: toB64(ct) };
}
async function mediaDecrypt(key, ivB64, ctB64) {
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(ivB64) }, key, fromB64(ctB64));
}

async function saveAttachment(file, note) {
  const bytes = await file.arrayBuffer();
  const rec = {
    id: 'm' + uid(), noteId: note.id, kind: mediaKind(file.type, file.name),
    mime: file.type || '', name: file.name || 'Attachment', size: bytes.byteLength, at: nowMs(),
  };
  if (note.vault) {
    if (!S.vault.key) throw new Error('the Vault is closed');
    const box = await mediaEncrypt(S.vault.key, bytes);
    rec.enc = true; rec.iv = box.iv; rec.ct = box.ct;
  } else {
    rec.blob = new Blob([bytes], { type: rec.mime || 'application/octet-stream' });
  }
  await dbPut('media', rec);
  return rec;
}

async function mediaObjectUrl(id) {
  if (MEDIA.urls[id]) return MEDIA.urls[id];
  const rec = await req(store('media').get(id));
  if (!rec) return null;
  let blob = rec.blob;
  if (!blob) {
    if (!S.vault.key) return null;
    try {
      blob = new Blob([await mediaDecrypt(S.vault.key, rec.iv, rec.ct)],
        { type: rec.mime || 'application/octet-stream' });
    } catch (e) { return null; }
  }
  const url = URL.createObjectURL(blob);
  MEDIA.urls[id] = url;
  return url;
}

function mediaRevokeAll() {
  Object.keys(MEDIA.urls).forEach(k => { try { URL.revokeObjectURL(MEDIA.urls[k]); } catch (e) {} });
  MEDIA.urls = {};
}

async function hydrateMedia(root) {
  if (!root) return;
  const imgs = $$('img[src^="unote-media:"]', root);
  for (const el of imgs) {
    const id = el.getAttribute('src').slice('unote-media:'.length);
    const url = await mediaObjectUrl(id);
    if (url) el.src = url; else el.remove();
  }
  const links = $$('a[href^="unote-media:"]', root);
  for (const a of links) {
    const id = a.getAttribute('href').slice('unote-media:'.length);
    const rec = await req(store('media').get(id));
    if (!rec) { a.removeAttribute('href'); a.classList.add('missing'); continue; }
    const url = await mediaObjectUrl(id);
    if (!url) {
      const box = document.createElement('div');
      box.className = 'media';
      box.innerHTML = '<div class="cap">In the Vault - open it to play this.</div>';
      a.replaceWith(box);
      continue;
    }
    if (rec.kind === 'audio' || rec.kind === 'video') {
      const box = document.createElement('div');
      box.className = 'media';
      const player = document.createElement(rec.kind);
      player.controls = true; player.preload = 'metadata'; player.src = url;
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = (rec.name || (rec.kind === 'audio' ? 'Recording' : 'Video')) +
        (rec.size ? ' · ' + Math.max(1, Math.round(rec.size / 1024)) + ' KB' : '');
      box.appendChild(player); box.appendChild(cap);
      a.replaceWith(box);
    } else {
      a.href = url; a.download = rec.name || 'file';
      a.textContent = (rec.name || 'Attachment') + ' · ' +
        (rec.size > 1048576 ? (rec.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round((rec.size || 0) / 1024)) + ' KB');
    }
  }
}

async function addFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  const note = S.current;
  if (!note) { toast('Open a note first, then add to it.'); return; }
  if (note.vault && !S.vault.key) { unlockDialog(() => addFiles(list)); return; }
  let done = 0;
  for (const f of list) {
    try {
      const rec = await saveAttachment(f, note);
      const token = rec.kind === 'image'
        ? '![](unote-media:' + rec.id + ')'
        : '[' + String(rec.name || 'Attachment').replace(/[\[\]]/g, '') + '](unote-media:' + rec.id + ')';
      const body = String(note.body || '').replace(/\s+$/, '');
      note.body = (body ? body + '\n\n' : '') + token + '\n';
      done++;
    } catch (e) {
      toast('Could not add ' + (f.name || 'that file') + (e && e.message ? ': ' + e.message : '.'));
    }
  }
  if (!done) return;
  await saveNote(note);
  if ($('#ed')) $('#ed').value = note.body;
  if ($('#pv')) { $('#pv').innerHTML = md(note.body); hydrateMedia($('#pv')); }
  toast(done === 1 ? 'Added to the note.' : 'Added ' + done + ' to the note.');
}

function mediaPaste(e) {
  const dt = e.clipboardData;
  if (!dt) return;
  const files = [];
  Array.from(dt.items || []).forEach(it => {
    if (it.kind === 'file') { const f = it.getAsFile(); if (f) files.push(f); }
  });
  if (!files.length) return;
  e.preventDefault();
  addFiles(files);
}

function attachDialog() {
  if (!S.current) { toast('Open a note first, then add to it.'); return; }
  const d = dialog({
    title: 'Add to this note',
    body: '<div class="hint" style="margin-top:0">A photo, a video, an audio file or a voice memo. It stays on this phone, inside the note.' +
        (S.current.vault ? ' This note is in the Vault, so anything added is sealed with your PIN.' : '') + '</div>' +
      '<button class="listrow" data-att="media"><span class="grow"><span class="lr-t">Photo or video</span><span class="lr-s">Pick one from this phone.</span></span><span class="chev">\u203a</span></button>' +
      '<button class="listrow" data-att="audio"><span class="grow"><span class="lr-t">Audio file</span><span class="lr-s">A recording you already have.</span></span><span class="chev">\u203a</span></button>' +
      '<button class="listrow" data-att="voice"><span class="grow"><span class="lr-t">Voice memo</span><span class="lr-s">Record it here and it goes into the note.</span></span><span class="chev">\u203a</span></button>' +
      '<div class="hint" style="margin:10px 0 0">Pasting a photo or a file straight into a note works too.</div>' +
      '<input type="file" id="attPhoto" accept="image/*,video/*" hidden multiple>' +
      '<input type="file" id="attAudio" accept="audio/*" hidden multiple>',
  });
  d.addEventListener('click', e => {
    const b = e.target.closest('[data-att]'); if (!b) return;
    if (b.dataset.att === 'media') { $('#attPhoto', d).click(); return; }
    if (b.dataset.att === 'audio') { $('#attAudio', d).click(); return; }
    recordVoiceMemo();
  });
  $$('#attPhoto,#attAudio', d).forEach(inp => inp.addEventListener('change', e => {
    const files = e.target.files;
    closeDialog();
    addFiles(files);
  }));
}

async function recordVoiceMemo() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    toast('This phone will not record from inside the app. Use Audio file instead.'); return;
  }
  let stream = null, rec = null;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { toast('No access to the microphone. Use Audio file instead.'); return; }
  const chunks = [];
  try { rec = new MediaRecorder(stream); }
  catch (e) { stream.getTracks().forEach(t => t.stop()); toast('This phone will not record from inside the app.'); return; }
  rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const type = rec.mimeType || 'audio/webm';
    const stamp = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    await addFiles([new File(chunks, 'Voice memo ' + stamp + '.webm', { type: type })]);
  };
  rec.start();
  const d = dialog({
    title: 'Voice memo',
    body: '<div class="vaulthero"><div class="lk"><div class="rec-dot"></div></div>' +
      '<h3>Recording</h3><p>Speak, then stop. It goes into this note.</p></div>',
    foot: '<div class="grow"></div><button class="btn primary" id="recStop">Stop and keep it</button>',
  });
  $('#recStop', d).addEventListener('click', () => {
    closeDialog();
    try { rec.stop(); } catch (e) {}
    toast('Keeping the recording…');
  });
  dlgOnClose = () => { try { if (rec && rec.state !== 'inactive') rec.stop(); } catch (e) {} };
}

function setupAttachments() {
  const top = $('#top');
  if (top && !$('#btnAttach')) {
    const b = document.createElement('button');
    b.className = 'iconbtn';
    b.id = 'btnAttach';
    b.title = 'Add a photo, video or voice memo';
    b.setAttribute('aria-label', 'Add to this note');
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15.5 7.5l-6.4 6.4a2.5 2.5 0 0 0 3.5 3.5l6.4-6.4a4.5 4.5 0 0 0-6.4-6.4L6 11a6.5 6.5 0 0 0 9.2 9.2"/></svg>';
    b.addEventListener('click', attachDialog);
    const fav = $('#btnFav');
    if (fav) top.insertBefore(b, fav); else top.appendChild(b);
  }
  const ed = $('#ed'), title = $('#title');
  if (ed && !ed.dataset.att) { ed.dataset.att = '1'; ed.addEventListener('paste', mediaPaste); }
  if (title && !title.dataset.att) { title.dataset.att = '1'; title.addEventListener('paste', mediaPaste); }
  window.addEventListener('pagehide', mediaRevokeAll);
}

async function bundleMedia() {
  const out = [];
  for (const m of await dbAll('media')) {
    const base = { id: m.id, noteId: m.noteId, kind: m.kind, mime: m.mime, name: m.name, size: m.size, at: m.at };
    if (m.enc) { base.enc = true; base.iv = m.iv; base.ct = m.ct; out.push(base); }
    else if (m.blob) { base.data = toB64(await m.blob.arrayBuffer()); out.push(base); }
  }
  return out;
}

async function pullInMedia(list) {
  let added = 0;
  for (const m of (list || [])) {
    if (!m || !m.id) continue;
    const have = await req(store('media').get(m.id));
    if (have) continue;
    const rec = { id: m.id, noteId: m.noteId, kind: m.kind || 'file', mime: m.mime || '', name: m.name || 'Attachment', size: m.size || 0, at: m.at || nowMs() };
    if (m.enc) { rec.enc = true; rec.iv = m.iv; rec.ct = m.ct; }
    else if (m.data) rec.blob = new Blob([fromB64(m.data)], { type: rec.mime || 'application/octet-stream' });
    else continue;
    await dbPut('media', rec);
    added++;
  }
  return added;
}

/* start */
document.addEventListener('DOMContentLoaded', () => {
  boot().catch(err => {
    document.body.innerHTML = '<div style="padding:40px;font:15px system-ui;color:#e9ecf4">' +
      'UNote could not start.<br><br><code style="opacity:.7">' + esc(err && err.message) + '</code></div>';
  });
});

</script>
